<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Theme / Status Bar Colors -->
  <!-- Android Chrome -->
  <meta name="theme-color" content="[var(--color-gray)]">

  <!-- iOS Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    (() => {
      const isDarkMode = localStorage.getItem("theme") === "dark";
      const themeColor = isDarkMode ? "var(--color-dark)" : "var(--color-gray)";

      document.documentElement.dataset.theme = isDarkMode ? "dark" : "light";
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", themeColor);
      document
        .querySelector('meta[name="msapplication-TileColor"]')
        ?.setAttribute("content", themeColor);
      document
        .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
        ?.setAttribute("content", isDarkMode ? "black-translucent" : "default");
      document.documentElement.style.backgroundColor = themeColor;
    })();
  </script>

  <link rel="apple-touch-icon" sizes="180x180" href="./src/assets/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/src//assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon.ico">
  <link rel="manifest" href="/src/assets/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zin Oo</title>
</head>

<body class="">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
